<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <div class="container">
        <div class="container-score">
            <div>
                <input id="nombre-jugado1" type="text" value="Player One" autocomplete="off">
                <h2 id="puntuacion-playerOne">0</h2>
            </div>
            <div>
                <input id="nombre-jugado2" type="text" value="Player Two" autocomplete="off">
                <h2 id="puntuacion-playerTwo">0</h2>
            </div>
        </div>
        <h2 id="message"></h2>
        <table id="tablet" class="tablet">
            <tbody>
                <tr>

                    <td class="cell" data-id="0"></td>
                    <td class="cell" data-id="1"></td>
                    <td class="cell" data-id="2"></td>

                </tr>
                <tr>

                    <td class="cell" data-id="3"></td>
                    <td class="cell" data-id="4"></td>
                    <td class="cell" data-id="5"></td>

                </tr>
                <tr>
                    <td class="cell" data-id="6"></td>
                    <td class="cell" data-id="7"></td>
                    <td class="cell" data-id="8"></td>
                </tr>
            </tbody>
        </table>
        <button id="iniciar" class="start">Iniciar</button>
    </div>
    <script src="./app.js"></script>
</body>

</html>
