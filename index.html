<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <div>
        <table id="tabla">
            <tr>
                <tbody>
                    <td class="celda" data-id="0" data-array="0"></td>
                    <td class="celda" data-id="1" data-array="1"></td>
                    <td class="celda" data-id="2" data-array="2"></td>
                </tbody>
            </tr>
            <tr>
                <tbody>
                    <td class="celda" data-id="3" data-array="0"></td>
                    <td class="celda" data-id="4" data-array="1"></td>
                    <td class="celda" data-id="5" data-array="2"></td>
                </tbody>
            </tr>
            <tr>
                <tbody>
                    <td class="celda" data-id="6" data-array="0"></td>
                    <td class="celda" data-id="7" data-array="1"></td>
                    <td class="celda" data-id="8" data-array="2"></td>
                </tbody>
            </tr>
        </table>
    </div>
    <script src="./app.js"></script>
</body>

</html>
