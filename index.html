<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <div>
        <label for="nombre-jugado1">INgrese el nombre del primer jugador</label>
        <input id="nombre-jugado1" type="text">
        <label for="nombre-jugado2">INgrese el nombre del segundo jugador</label>
        <input id="nombre-jugado2" type="text">
        <p id="puntuacion"></p>
        <table id="tabla">
            <tr>
                <tbody>
                    <td class="celda" data-id="0"></td>
                    <td class="celda" data-id="1"></td>
                    <td class="celda" data-id="2"></td>
                </tbody>
            </tr>
            <tr>
                <tbody>
                    <td class="celda" data-id="3"></td>
                    <td class="celda" data-id="4"></td>
                    <td class="celda" data-id="5"></td>
                </tbody>
            </tr>
            <tr>
                <tbody>
                    <td class="celda" data-id="6"></td>
                    <td class="celda" data-id="7"></td>
                    <td class="celda" data-id="8"></td>
                </tbody>
            </tr>
        </table>
        <button id="iniciar">Iniciar</button>
        <button id="nueva-partida">Nuevo Juego</button>
    </div>
    <script src="./app.js"></script>
</body>

</html>
